name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths: [ "spring-petclinic/**" ]
  pull_request:
    paths: [ "spring-petclinic/**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-petclinic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: |
          ./mvnw -B test

      - name: Run checkstyle (validate)
        run: |
          ./mvnw -B validate

      - name: Package
        run: |
          ./mvnw -B package -DskipTests=false

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Option A: Push to GHCR (recommended for GitHub-hosted projects)
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: ./spring-petclinic
          file: ./spring-petclinic/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spring-petclinic:${{ github.sha }}
          build-args: |
            JAR_FILE=target/*.jar

      # Option B: If you prefer Docker Hub, comment GHCR steps and use:
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     registry: docker.io
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - name: Build and push image to Docker Hub
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: ./spring-petclinic
      #     file: ./spring-petclinic/Dockerfile
      #     push: true
      #     tags: ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

  deploy-to-k8s:
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main'  # only deploy from main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'

      - name: Apply k8s manifests
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          echo "${KUBECONFIG_BASE64}" | base64 --decode > kubeconfig
          kubectl --kubeconfig=kubeconfig apply -f spring-petclinic/k8s/
          kubectl --kubeconfig=kubeconfig -n default rollout status deployment/petclinic --timeout=120s
