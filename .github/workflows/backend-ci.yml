name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths: [ "spring-petclinic/**" ]
  pull_request:
    branches: [ main, develop ]
    paths: [ "spring-petclinic/**" ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-petclinic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run code validation (checkstyle)
        run: |
          ./mvnw -B validate

      - name: Run unit tests
        run: |
          ./mvnw -B test

      - name: Build application
        run: |
          ./mvnw -B package -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: spring-petclinic/target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: spring-petclinic/target/surefire-reports/**/*.xml
          check_name: Backend Test Results

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-jar
          path: spring-petclinic/target/*.jar
          retention-days: 7

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/spring-petclinic
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./spring-petclinic
          file: ./spring-petclinic/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/spring-petclinic:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/spring-petclinic:buildcache,mode=max

  deploy-to-k8s:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          if [ -z "$KUBECONFIG_BASE64" ]; then
            echo "⚠️  KUBE_CONFIG_BASE64 secret not configured. Skipping K8s deployment."
            echo "To enable K8s deployment, add KUBE_CONFIG_BASE64 secret to your repository."
            exit 0
          fi
          
          echo "${KUBECONFIG_BASE64}" | base64 --decode > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          
          echo "Applying K8s manifests..."
          kubectl apply -f spring-petclinic/k8s/
          
          echo "Waiting for rollout..."
          kubectl rollout status deployment/petclinic -n default --timeout=120s || true
          
          echo "Deployment completed successfully!"
          rm -f kubeconfig

  notify-deployment:
    needs: [build-and-test, build-and-push-image, deploy-to-k8s]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Status
        run: |
          echo "Backend CI/CD Pipeline Completed"
          echo "Build Status: ${{ needs.build-and-test.result }}"
          echo "Image Build Status: ${{ needs.build-and-push-image.result }}"
          echo "Deployment Status: ${{ needs.deploy-to-k8s.result }}"
