name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths: [ "petclinic-ui/**" ]
  pull_request:
    branches: [ main, develop ]
    paths: [ "petclinic-ui/**" ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petclinic-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'petclinic-ui/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present || echo "No linter configured"

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: petclinic-ui/dist/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petclinic-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'petclinic-ui/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

  build-and-push-image:
    needs: [lint-and-build, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/petclinic-ui
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./petclinic-ui
          file: ./petclinic-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/petclinic-ui:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/petclinic-ui:buildcache,mode=max

  deploy-to-k8s:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          if [ -z "$KUBECONFIG_BASE64" ]; then
            echo "⚠️  KUBE_CONFIG_BASE64 secret not configured. Skipping K8s deployment."
            echo "To enable K8s deployment, add KUBE_CONFIG_BASE64 secret to your repository."
            exit 0
          fi
          
          echo "${KUBECONFIG_BASE64}" | base64 --decode > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          
          # Apply frontend deployment if exists
          if [ -d "petclinic-ui/k8s" ]; then
            echo "Applying frontend K8s manifests..."
            kubectl apply -f petclinic-ui/k8s/
          fi
          
          echo "Checking UI deployment..."
          kubectl rollout status deployment/petclinic-ui -n default --timeout=120s || true
          
          echo "Frontend deployment completed!"
          rm -f kubeconfig

  notify-deployment:
    needs: [lint-and-build, security-scan, build-and-push-image, deploy-to-k8s]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Status
        run: |
          echo "Frontend CI/CD Pipeline Completed"
          echo "Lint & Build Status: ${{ needs.lint-and-build.result }}"
          echo "Security Scan Status: ${{ needs.security-scan.result }}"
          echo "Image Build Status: ${{ needs.build-and-push-image.result }}"
          echo "Deployment Status: ${{ needs.deploy-to-k8s.result }}"
